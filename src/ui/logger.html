<!doctype html>
<html><head><meta charset="utf-8"><title>Veil logger</title>
<style>
body{font:12px system-ui;margin:0;background:#1b1b1f;color:#eee}
.bar{position:sticky;top:0;background:#222;padding:8px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #333}
input,select{background:#111;color:#eee;border:1px solid #444;padding:3px}
button{background:#2b2b31;color:#eee;border:1px solid #444;border-radius:4px;padding:3px 10px;cursor:pointer}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #2a2a2a;padding:2px 6px;text-align:left;font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:600px}
.blocked{color:#f77}.allow{color:#7f7}.redirected{color:#fc6}.would{color:#fa5}
</style></head>
<body>
<div class="bar">Tab <select id="tab"></select> <input id="filter" placeholder="filter text"> <label><input type="checkbox" id="on"> logging</label> <button id="clear">Clear</button> <span id="n"></span>
<span style="margin-left:auto;color:#999">status: blocked = DNR blocked it · would-block = engine says block but DNR let it through (false negative)</span></div>
<table id="t"><thead><tr><th>Status</th><th>Type</th><th>URL</th><th>Initiator</th><th>Filter</th></tr></thead><tbody></tbody></table>
<script type="module" src="logger.js"></script>
</body></html>
