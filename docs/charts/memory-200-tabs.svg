<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 254" width="720" height="254" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Memory overhead at 200 tabs</title>
<desc id="d">Extra private memory over Chrome with no blocker, same page in every tab (lower is better). Veil: 538 MB; AdGuard MV3: 1,448 MB; uBlock Origin Lite: 1,675 MB; Ghostery: 3,710 MB.</desc>
<style>
  .surface { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font-size: 17px; font-weight: 600; }
  .subtitle, .note { fill: #52514e; font-size: 12.5px; }
  .lbl { fill: #52514e; font-size: 13px; }
  .lbl.hi, .val.hi { fill: #0b0b0b; font-weight: 600; }
  .sub { fill: #898781; font-size: 11px; }
  .val { fill: #52514e; font-size: 13px; font-variant-numeric: tabular-nums; }
  .bar { fill: #c3c2b7; }
  .bar-hi { fill: #2a78d6; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .title, .lbl.hi, .val.hi { fill: #f0efec; }
    .subtitle, .note, .lbl, .val { fill: #c3c2b7; }
    .bar { fill: #5c5b57; }
    .bar-hi { fill: #3987e5; }
    .axis { stroke: #383835; }
  }
</style>
<rect class="surface" width="720" height="254" rx="8"/>
<text class="title" x="20" y="32">Memory overhead at 200 tabs</text>
<text class="subtitle" x="20" y="54">Extra private memory over Chrome with no blocker, same page in every tab (lower is better)</text>
<line class="axis" x1="210" x2="210" y1="74" y2="218"/>
<g><title>Veil: 538 MB</title><text class="lbl hi" x="198" y="99" text-anchor="end">Veil</text><path class="bar-hi" d="M210,85h56.3256064690027a4,4 0 0 1 4,4v12a4,4 0 0 1 -4,4h-56.3256064690027z"/><text class="val hi" x="278.3256064690027" y="99">538 MB</text></g>
<g><title>AdGuard MV3: 1,448 MB</title><text class="lbl" x="198" y="133" text-anchor="end">AdGuard MV3</text><path class="bar" d="M210,119h158.3633423180593a4,4 0 0 1 4,4v12a4,4 0 0 1 -4,4h-158.3633423180593z"/><text class="val" x="380.36334231805927" y="133">1,448 MB</text></g>
<g><title>uBlock Origin Lite: 1,675 MB</title><text class="lbl" x="198" y="167" text-anchor="end">uBlock Origin Lite</text><path class="bar" d="M210,153h183.81671159029648a4,4 0 0 1 4,4v12a4,4 0 0 1 -4,4h-183.81671159029648z"/><text class="val" x="405.81671159029645" y="167">1,675 MB</text></g>
<g><title>Ghostery: 3,710 MB</title><text class="lbl" x="198" y="201" text-anchor="end">Ghostery</text><path class="bar" d="M210,187h412a4,4 0 0 1 4,4v12a4,4 0 0 1 -4,4h-412z"/><text class="val" x="634" y="201">3,710 MB</text></g>
<text class="note" x="20" y="240">Source: bench/results/memory.json. Chrome 157; uBO (MV2) and Brave were not in the memory run.</text>
</svg>
