<title id="t">Third-party trackers let through</title>
<desc id="d">Ad/tracker requests to other domains that loaded anyway, all sites (fewer is better). Veil: 538; Ghostery: 604; uBlock Origin (MV2) (Chrome 126 batch): 815; uBlock Origin Lite: 919; Brave Shields (Brave batch): 1,011; AdGuard MV3: 9,247.</desc>
