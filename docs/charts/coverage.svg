<g><title>Ghostery: 87.0%</title><text class="lbl" x="198" y="133" text-anchor="end">Ghostery</text><path class="bar" d="M210,119h401.43708183933273a4,4 0 0 1 4,4v12a4,4 0 0 1 -4,4h-401.43708183933273z"/><text class="val" x="623.4370818393327" y="133">87.0%</text></g>
<g><title>uBlock Origin (MV2) (Chrome 126 batch): 83.4%</title><text class="lbl" x="198" y="159" text-anchor="end">uBlock Origin (MV2)</text><text class="sub" x="198" y="175" text-anchor="end">Chrome 126 batch</text><path class="bar" d="M210,153h384.99757067236567a4,4 0 0 1 4,4v12a4,4 0 0 1 -4,4h-384.99757067236567z"/><text class="val" x="606.9975706723657" y="167">83.4%</text></g>
<g><title>uBlock Origin Lite: 82.9%</title><text class="lbl" x="198" y="201" text-anchor="end">uBlock Origin Lite</text><path class="bar" d="M210,187h382.5634308946304a4,4 0 0 1 4,4v12a4,4 0 0 1 -4,4h-382.5634308946304z"/><text class="val" x="604.5634308946304" y="201">82.9%</text></g>
<g><title>Brave Shields (Brave batch): 65.6%</title><text class="lbl" x="198" y="227" text-anchor="end">Brave Shields</text><text class="sub" x="198" y="243" text-anchor="end">Brave batch</text><path class="bar" d="M210,221h301.7686248988605a4,4 0 0 1 4,4v12a4,4 0 0 1 -4,4h-301.7686248988605z"/><text class="val" x="523.7686248988605" y="235">65.6%</text></g>
