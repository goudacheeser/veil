<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Blocking coverage</title>
<desc id="d">Share of ad and tracker requests blocked (higher is better). Veil: 89.2%; Ghostery: 87.0%; uBlock Origin (MV2) (Chrome 126 batch): 83.4%; uBlock Origin Lite: 82.9%; Brave Shields (Brave batch): 65.6%; AdGuard MV3: 18.3%.</desc>
<style>
  .surface { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font-size: 17px; font-weight: 600; }
  .subtitle, .note { fill: #52514e; font-size: 12.5px; }
  .lbl { fill: #52514e; font-size: 13px; }
  .lbl.hi, .val.hi { fill: #0b0b0b; font-weight: 600; }
  .sub { fill: #898781; font-size: 11px; }
  .val { fill: #52514e; font-size: 13px; font-variant-numeric: tabular-nums; }
  .bar { fill: #c3c2b7; }
  .bar-hi { fill: #2a78d6; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .title, .lbl.hi, .val.hi { fill: #f0efec; }
    .subtitle, .note, .lbl, .val { fill: #c3c2b7; }
    .bar { fill: #5c5b57; }
    .bar-hi { fill: #3987e5; }
    .axis { stroke: #383835; }
  }
</style>
<rect class="surface" width="720" height="322" rx="8"/>
<text class="title" x="20" y="32">Blocking coverage</text>
<text class="subtitle" x="20" y="54">Share of ad and tracker requests blocked (higher is better)</text>
<line class="axis" x1="210" x2="210" y1="74" y2="286"/>
